[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avalanche-opt"
version = "1.2.0"
authors = [
  { name="Jassim Ibrahim Farooqi" },
  { name="OpenBlade", email="contact@openblade.ai" },
]
description = "Ultra-Low VRAM Matrix-Factorized & Multi-Precision (4-bit, 8-bit, FP16, BF16, FP32) Lossless Optimizer for PyTorch"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=1.13.0",
]

[project.urls]
"Homepage" = "https://github.com/OpenBladeAI/Avalanche"
"Organization" = "https://github.com/OpenBladeAI"
"HuggingFace" = "https://huggingface.co/OpenBlade"
"Repository" = "https://github.com/OpenBladeAI/Avalanche"

[tool.setuptools]
packages = ["avalanche"]

[tool.setuptools.package-dir]
"avalanche" = "."
