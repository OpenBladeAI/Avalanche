[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avalanche-opt"
version = "1.0.0"
authors = [
  { name="Jassim Ibrahim Farooqi" },
  { name="OpenBlade", email="contact@openblade.ai" },
]
description = "Ultra-Low VRAM Matrix-Factorized Optimizer for PyTorch (An OpenBlade Release)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=1.13.0",
]

[project.urls]
"Homepage" = "https://github.com/OpenBladeAI/avalanche"
"Organization" = "https://github.com/OpenBladeAI"
"HuggingFace" = "https://huggingface.co/OpenBlade"
"Repository" = "https://github.com/OpenBladeAI/avalanche"
